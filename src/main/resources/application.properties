# In-memory H2. DB_CLOSE_DELAY=-1 keeps the database open for the whole app run.
spring.datasource.url=jdbc:h2:mem:transfer;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# schema.sql is the only schema source. Hibernate must not create or alter tables.
spring.jpa.hibernate.ddl-auto=none
# false means schema.sql runs before JPA starts.
spring.jpa.defer-datasource-initialization=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=file:./schema.sql
